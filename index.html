    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: #050b18;
            font-family: Arial, Helvetica, sans-serif;
        }

        .telegram-card {
            width: 100%;
            max-width: 627px;
            min-height: 520px;
            padding: 62px 30px 50px;
            background: #0e1d3c;
            border: 1px solid #164da7;
            border-radius: 14px;
            box-shadow:
                0 0 12px rgba(37, 99, 235, 0.35),
                0 0 28px rgba(37, 99, 235, 0.18);
            text-align: center;
        }

        /* Telegram Icon */
        .telegram-icon {
            width: 86px;
            height: 86px;
            margin: 0 auto 27px;
            border-radius: 23px;
            background: #2864e5;
            border: 4px solid #174da9;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .telegram-icon svg {
            width: 48px;
            height: 48px;
            fill: white;
        }

        /* Heading */
        .telegram-card h1 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 24px;
        }

        /* Description */
        .description {
            max-width: 430px;
            margin: 0 auto;
            color: #8d94a5;
            font-size: 18px;
            line-height: 1.5;
        }

        /* Button */
        .telegram-btn {
            width: 100%;
            max-width: 360px;
            height: 63px;
            margin: 44px auto 26px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;

            background: #2864e5;
            color: #ffffff;
            text-decoration: none;

            border-radius: 6px;
            font-size: 19px;
            font-weight: 700;

            transition: all 0.25s ease;
        }

        .telegram-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .telegram-btn:hover {
            background: #3471f2;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        .telegram-btn:active {
            transform: translateY(0);
        }

        /* Bottom Text */
        .bottom-text {
            color: #7d8495;
            font-size: 15px;
            line-height: 1.5;
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .telegram-card {
                min-height: auto;
                padding: 45px 20px 40px;
                border-radius: 13px;
            }

            .telegram-icon {
                width: 76px;
                height: 76px;
                border-radius: 21px;
                margin-bottom: 24px;
            }

            .telegram-icon svg {
                width: 42px;
                height: 42px;
            }

            .telegram-card h1 {
                font-size: 27px;
                margin-bottom: 20px;
            }

            .description {
                font-size: 16px;
                max-width: 340px;
            }

            .telegram-btn {
                max-width: 100%;
                height: 60px;
                margin-top: 38px;
                font-size: 17px;
            }

            .bottom-text {
                font-size: 14px;
            }
        }

        /* Small Mobile */
        @media (max-width: 380px) {

            .telegram-card {
                padding: 38px 16px 35px;
            }

            .telegram-card h1 {
                font-size: 24px;
            }

            .description {
                font-size: 15px;
            }

            .telegram-btn {
                height: 56px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

            </svg>
        </div>

        <!-- Heading -->
        <h1>Join Our Telegram</h1>

        <!-- Description -->
        <p class="description">
            Tap the button below to join our exclusive channel
            and never miss an update.
        </p>

        <!-- Telegram Button -->
        <a
            href="https://t.me/+WHMicRN8kY01MWJl"
            class="telegram-btn"
            target="_blank"
        >
            <svg viewBox="0 0 24 24">
                <path d="M21.4 3.6L18.2 20c-.2 1.2-.9 1.5-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L5.6 13.5.7 12c-1.1-.3-1.1-1 .2-1.5L20.1 3c.9-.3 1.7.2 1.3.6z"/>
            </svg>

            JOIN TELEGRAM
        </a>

        <!-- Bottom Text -->
        <p class="bottom-text">
            Free to join · Instant access · Premium content
        </p>

    </div>

</body>
</html>
